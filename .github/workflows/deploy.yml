name: 每日安全扫描 & 痛点日报部署

on:
  schedule:
    # 北京时间 ~8:11 (UTC+8 → UTC 0:11，避开整点高峰)
    - cron: '11 0 * * *'
  workflow_dispatch:

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests cos-python-sdk-v5

      - name: 生成 config.ini
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          cat > config.ini << 'CONFEOF'
          [GitHub]
          token = GITHUB_TOKEN_PLACEHOLDER

          [LLM]
          api_key = LLM_API_KEY_PLACEHOLDER
          api_base = LLM_API_BASE_PLACEHOLDER
          model = LLM_MODEL_PLACEHOLDER

          [Proxy]
          http =
          https =

          [Deploy]
          max_pipeline_retries = 3
          llm_analysis_min_ratio = 0.8
          alert_webhook_url = ALERT_WEBHOOK_PLACEHOLDER

          [COS]
          bucket = COS_BUCKET_PLACEHOLDER
          region = COS_REGION_PLACEHOLDER
          CONFEOF

          # 替换占位符
          sed -i "s|GITHUB_TOKEN_PLACEHOLDER|${GH_PAT}|g" config.ini
          sed -i "s|LLM_API_KEY_PLACEHOLDER|${LLM_API_KEY}|g" config.ini
          sed -i "s|LLM_API_BASE_PLACEHOLDER|${LLM_API_BASE}|g" config.ini
          sed -i "s|LLM_MODEL_PLACEHOLDER|${LLM_MODEL}|g" config.ini
          sed -i "s|ALERT_WEBHOOK_PLACEHOLDER|${ALERT_WEBHOOK_URL:-}|g" config.ini
          sed -i "s|COS_BUCKET_PLACEHOLDER|${COS_BUCKET:-}|g" config.ini
          sed -i "s|COS_REGION_PLACEHOLDER|${COS_REGION:-ap-shanghai}|g" config.ini

      - name: 从 COS 下载今日已有数据
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          TODAY=$(date '+%Y-%m-%d')
          echo "📥 尝试从 COS 下载今日已有数据: $TODAY"

          python3 -c "
          import os
          from qcloud_cos import CosConfig, CosS3Client

          secret_id = os.environ['COS_SECRET_ID']
          secret_key = os.environ['COS_SECRET_KEY']
          bucket = os.environ['COS_BUCKET']
          region = os.environ['COS_REGION']

          if not secret_id or not secret_key or not bucket:
              print('COS 凭证未配置，跳过下载')
              exit(0)

          config = CosConfig(Region=region, SecretId=secret_id, SecretKey=secret_key)
          client = CosS3Client(config)

          today = '$TODAY'
          os.makedirs('data', exist_ok=True)

          for ext in ['.json', '.js', '-pain.json', '-pain.js']:
              cos_key = f'data/{today}{ext}'
              local_path = f'data/{today}{ext}'
              try:
                  resp = client.get_object(Bucket=bucket, Key=cos_key)
                  with open(local_path, 'wb') as f:
                      f.write(resp['Body'].get_raw_stream().read())
                  size = os.path.getsize(local_path)
                  print(f'  ✅ 已下载 {cos_key} ({size} bytes)')
              except Exception:
                  print(f'  ⏭️  {cos_key} 不存在（今日首次运行）')
          "

      - name: 运行安全爬虫
        id: sec_crawl
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set +e
          python3 crawl.py
          CRAWL_EXIT=$?
          set -e

          TODAY=$(date '+%Y-%m-%d')
          if [ $CRAWL_EXIT -ne 0 ]; then
            echo "::warning::crawl.py 退出码 $CRAWL_EXIT"
          fi

          if [ -f "data/${TODAY}.json" ]; then
            SIZE=$(wc -c < "data/${TODAY}.json")
            ITEMS=$(python3 -c "import json; print(len(json.load(open('data/${TODAY}.json')).get('items',[])))")
            echo "📊 安全数据: ${SIZE} bytes, ${ITEMS} 条"
            echo "sec_items=${ITEMS}" >> $GITHUB_OUTPUT
            echo "sec_exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::安全数据文件未生成"
            echo "sec_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 运行痛点爬虫
        id: pain_crawl
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set +e
          python3 crawl_pain.py
          PAIN_EXIT=$?
          set -e

          TODAY=$(date '+%Y-%m-%d')
          if [ $PAIN_EXIT -ne 0 ]; then
            echo "::warning::crawl_pain.py 退出码 $PAIN_EXIT"
          fi

          if [ -f "data/${TODAY}-pain.json" ]; then
            PAIN_ITEMS=$(python3 -c "import json; print(len(json.load(open('data/${TODAY}-pain.json')).get('top10',[])))")
            echo "📊 痛点数据: Top ${PAIN_ITEMS}"
            echo "pain_top10=${PAIN_ITEMS}" >> $GITHUB_OUTPUT
            echo "pain_exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::痛点数据文件未生成"
            echo "pain_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 上传到 COS
        if: steps.sec_crawl.outputs.sec_exists == 'true' || steps.pain_crawl.outputs.pain_exists == 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          echo "📤 上传文件到 COS..."

          python3 -u -c "
          import os, socket
          from qcloud_cos import CosConfig, CosS3Client

          # 强制无缓冲输出，让 CI 实时看到进度，避免长时间静默后被 timeout 杀掉
          def log(msg):
              print(msg, flush=True)

          secret_id = os.environ['COS_SECRET_ID']
          secret_key = os.environ['COS_SECRET_KEY']
          bucket = os.environ['COS_BUCKET']
          region = os.environ['COS_REGION']

          if not secret_id or not secret_key or not bucket:
              log('COS 凭证未配置，跳过上传')
              exit(0)

          # 给所有 COS 请求设 60s 超时，单文件卡住时快速失败而非拖到 45min
          config = CosConfig(Region=region, SecretId=secret_id, SecretKey=secret_key, timeout=60)
          client = CosS3Client(config)
          socket.setdefaulttimeout(60)

          CC = 'max-age=60'
          CT_MAP = {
              '.json': 'application/json; charset=utf-8',
              '.js': 'application/javascript; charset=utf-8',
              '.html': 'text/html; charset=utf-8',
          }

          # 1. 列出 COS 上 data/ 下已有的对象（分页拿全）
          cos_keys = {}
          marker = ''
          while True:
              resp = client.list_objects(Bucket=bucket, Prefix='data/', Marker=marker, MaxKeys=1000)
              for item in resp.get('Contents', []) or []:
                  cos_keys[item['Key']] = int(item.get('Size', -1))
              if str(resp.get('IsTruncated', '')).lower() == 'true':
                  marker = resp.get('NextMarker', '')
                  if not marker:
                      break
              else:
                  break
          log(f'📋 COS 上 data/ 已有 {len(cos_keys)} 个对象')

          # 2. 计算本地待上传文件（index.html + data/ 全量）
          locals_ = [('index.html', 'index.html')]
          if os.path.isdir('data'):
              for root, dirs, files in os.walk('data'):
                  for fname in files:
                      local = os.path.join(root, fname)
                      cos_key = local.replace(os.sep, '/')
                      locals_.append((local, cos_key))

          # 3. 只上传 COS 上缺失或 size 不一致的文件，已存在的跳过
          uploaded = 0
          skipped = 0
          for local, cos_key in locals_:
              if not os.path.exists(local):
                  continue
              size = os.path.getsize(local)
              if cos_key in cos_keys and cos_keys[cos_key] == size:
                  skipped += 1
                  continue
              ct = CT_MAP.get(os.path.splitext(local)[1], 'application/octet-stream')
              action = '更新' if cos_key in cos_keys else '上传'
              log(f'  📤 [{action}] {cos_key} ({size} bytes)')
              with open(local, 'rb') as f:
                  client.put_object(
                      Bucket=bucket, Key=cos_key, Body=f,
                      ContentType=ct, CacheControl=CC
                  )
              uploaded += 1

          log(f'✅ COS 上传完成：新传/更新 {uploaded} 个，跳过已存在 {skipped} 个')
          "

      - name: 数据备份到 Git 仓库
        if: steps.sec_crawl.outputs.sec_exists == 'true' || steps.pain_crawl.outputs.pain_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet data/; then
            echo "📦 data/ 无变化，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/
          git commit -m "data: 自动备份 $(TZ='Asia/Shanghai' date '+%Y-%m-%d') 安全数据"

          # 拉取远程最新 + 重试 push（应对 GitHub 服务端瞬时错误）
          # GIT_EDITOR=true 防止 rebase 冲突时等待交互输入导致 CI 卡死
          GIT_EDITOR=true git pull --rebase origin master || true
          for i in 1 2 3; do
            if git push origin master 2>&1; then
              echo "✅ 已备份到 Git 仓库"
              exit 0
            fi
            echo "⚠️  push 失败（第 ${i} 次），10 秒后重试..."
            sleep 10
          done
          echo "❌ push 失败 3 次，放弃"
          exit 1

      - name: 发送告警（失败时）
        if: failure() || (steps.sec_crawl.outputs.sec_exists != 'true' && steps.pain_crawl.outputs.pain_exists != 'true')
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "${ALERT_WEBHOOK_URL}" ]; then
            echo "⚠️  未配置 ALERT_WEBHOOK_URL，跳过告警"
            exit 0
          fi

          TODAY=$(date '+%Y-%m-%d %H:%M')
          ACTION_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # 自动识别通知渠道
          if echo "${ALERT_WEBHOOK_URL}" | grep -q "sctapi.ftqq.com"; then
            # Server 酱（推送到微信）
            TITLE="【Agent安全监控】${TODAY} 执行失败"
            DESP="日期: ${TODAY}\n详情: ${ACTION_URL}\n请检查 LLM API 或 GitHub Token 是否正常"
            curl -s -X POST "${ALERT_WEBHOOK_URL}" \
              -d "title=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${TITLE}'))")" \
              -d "desp=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${DESP}'))")"
            echo "✅ 已通过 Server 酱推送微信通知"
          elif echo "${ALERT_WEBHOOK_URL}" | grep -q "pushplus"; then
            # PushPlus（推送到微信）
            curl -s -X POST "${ALERT_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"【Agent安全监控】执行失败\",\"content\":\"<p>日期: ${TODAY}</p><p><a href='${ACTION_URL}'>查看详情</a></p>\"}"
            echo "✅ 已通过 PushPlus 推送通知"
          else
            # 企业微信 / 钉钉 / 飞书 机器人
            curl -s -X POST "${ALERT_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{
                \"msgtype\": \"text\",
                \"text\": {
                  \"content\": \"【Agent 安全监控】执行失败\n${TODAY}\n${ACTION_URL}\"
                }
              }"
            echo "✅ 已通过 Webhook 推送通知"
          fi
